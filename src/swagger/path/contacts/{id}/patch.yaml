tags:
  - Contacts
summary: Patch contact
operationId: patchContact
description: 'Patch contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "contact's name"
            type: string
            example: 'John Doe'
            nullable: true
          phoneNumber:
            description: "contact's phone number"
            type: string
            example: '+380000000007'
            nullable: true
          email:
            description: "contact's email"
            type: string
            nullable: true
          isFavourite:
            description: 'Whether is contact favourite'
            type: boolean
            example: false
            nullable: true
          contactType:
            description: "contact type"
            type: string
            enum: ['work', 'home', 'personal']
            nullable: true
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
            nullable: true
responses:
  '200':
    description: 'Patch contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contacts.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'